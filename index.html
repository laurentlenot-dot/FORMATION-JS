<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Boulangerie Fournil — Découvrez nos délicieuses créations artisanales.">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./Assets/CSS/style.css">
    <!-- Bootstrap JS (avec Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
    <script src="./Assets/scripts/script.js" defer></script> 

    <title>Boulangerie Fournil</title>
</head>
<body>
    <header>
        <div class="titre">
            <h1>Le Fournil</h1>
        </div>
        <nav class="header-nav">
            <a href="#" class="btnTop">Accueil</a>
            <a href="#" class="btnTop">La Carte</a>
            <a href="#" class="btnTop">Nous contacter</a>
        </nav>
    </header>

    <main class="container my-4">  
        <section class="savoirFaire mb-4 text-center">
            <h2>Notre savoir-faire</h2>
            <p>Découvrez nos délicieuses créations artisanales depuis 1994.</p>
        </section>

        <div class="main-layout">
            <section class="products">
                <h2 class="text-center mb-4">Nos Produits</h2>
                
                <!-- Conteneur flex centré avec Bootstrap -->
                <div class="d-flex justify-content-center">
                    <div style="max-width: 600px;" class="w-100">
                        <div id="boulangerieCarousel" class="carousel slide" data-bs-ride="carousel">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#boulangerieCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Baguette Tradition"></button>
                                <button type="button" data-bs-target="#boulangerieCarousel" data-bs-slide-to="1" aria-label="Croissant pur Beurre"></button>
                                <button type="button" data-bs-target="#boulangerieCarousel" data-bs-slide-to="2" aria-label="Pain Complet"></button>
                            </div>

                            <div class="carousel-inner">
                                <div class="carousel-item active">
                                    <img src="./Assets/Images/baguette.avif" class="d-block w-100" alt="Baguette Tradition" height="300" style="object-fit: cover;">
                                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                                        <h5>Baguette Tradition</h5>
                                    </div>
                                </div>
                                <div class="carousel-item">
                                    <img src="./Assets/Images/croissant.avif" class="d-block w-100" alt="Croissant pur Beurre" height="300" style="object-fit: cover;">
                                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                                        <h5>Croissant pur Beurre</h5>
                                    </div>
                                </div>
                                <div class="carousel-item">
                                    <img src="./Assets/Images/pain.avif" class="d-block w-100" alt="Pain Complet" height="300" style="object-fit: cover;">
                                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                                        <h5>Pain Complet</h5>
                                    </div>
                                </div>
                            </div>

                            <button class="carousel-control-prev" type="button" data-bs-target="#boulangerieCarousel" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Précédent</span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#boulangerieCarousel" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Suivant</span>
                            </button>
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Le Fournil. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="#" class="btnFooter">Mentions légales</a>
            <a href="#" class="btnFooter">Politique de confidentialité</a>
        </div>
    </footer>
</body>
</html>
