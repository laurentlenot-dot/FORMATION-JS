<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Boulangerie Fournil — Découvrez nos délicieuses créations artisanales.">
    <link rel="stylesheet" href="./Assets/CSS/style.css">
    <script src="./Assets/scripts/script.js" defer></script> 

    <title>Boulangerie Fournil</title>
</head>
<body>
    <header>
        <div class="titre">
            <h1>Le Fournil</h1>
        </div>
        <nav class="header-nav">
            <a href="#" class="btnTop">Accueil</a>
            <a href="#" class="btnTop">La Carte</a>
            <a href="#" class="btnTop">Nous contacter</a>
        </nav>
    </header>

    <main class="container">  
                <section class="savoirFaire">
                <h2 class="accueil"></h2>
                <p>Découvrez nos délicieuses créations artisanales depuis 1994.</p>
            </section>
        <div class="main-layout">

            <section class="products">
                <h2>Nos Produits</h2>
                <div class="product-list">
                    <div class="product-item">
                        <figure>
                            <img src="./Assets/Images/baguette.avif" alt="Baguette" width="240" height="160">
                            <figcaption>Baguette Tradition</figcaption>
                        </figure>
                    </div>
                    <div class="product-item">
                        <figure>
                            <img src="./Assets/Images/croissant.avif" alt="Croissant" width="240" height="160">
                            <figcaption>Croissant pur Beurre</figcaption>
                        </figure>
                    </div>
                    <div class="product-item">
                        <figure>
                            <img src="./Assets/Images/pain.avif" alt="Pain Complet" width="240" height="160">
                            <figcaption>Pain Complet</figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Le Fournil. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="#" class="btnFooter">Mentions légales</a>
            <a href="#" class="btnFooter">Politique de confidentialité</a>
        </div>
    </footer>
</body>
</html>
